modules:
  jira:globalPage:
    - key: forge-jira-dashboard-hello-world-page
      resource: main
      resolver:
        function: resolver
      title: forge-jira-dashboard
  function:
    - key: resolver
      handler: index.handler
    - key: runMigrations
      handler: migrations.run
  sql:
    - key: main
      engine: mysql
  scheduledTrigger:
    - key: db-migrations
      function: runMigrations
      interval: hour
resources:
  - key: main
    path: static/hello-world/build
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/1ed727ab-0bc5-4be6-8bca-94592ab1f101
